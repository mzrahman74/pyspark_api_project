<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Directory</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        .controls { margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>

    <h2>Customer List</h2>

    <div class="controls">
        <label for="formatSelect">Format:</label>
        <select id="formatSelect" onchange="fetchCustomers()">
            <option value="json">JSON</option>
            <option value="xml">XML</option>
            <option value="csv">CSV</option>
        </select>

        <label for="countrySelect" style="margin-left: 15px;">Select Country:</label>
        <select id="countrySelect" onchange="fetchCustomers()">
            <option value="USA">USA</option>
            <option value="Canada">Canada</option>
            <option value="UK">UK</option>
            <option value="Bangladesh">Bangladesh</option>
            <option value="India">India</option>
            <option value="China">China</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Country</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <!-- Data rows injected via JavaScript -->
        </tbody>
    </table>

    <script>
        async function fetchCustomers() {
            const format = document.getElementById('formatSelect').value;
            const country = document.getElementById('countrySelect').value;

            // Route mapping: CSV goes to /customers/{country}, JSON/XML go to /{format}/customers/{country}
            const endpoint = format === 'csv' ? `/customers/${country}` : `/${format}/customers/${country}`;

            try {
                const response = await fetch(endpoint);
                const result = await response.json();

                const tbody = document.getElementById('table-body');
                tbody.innerHTML = "";

                if (result.customers && result.customers.length > 0) {
                    result.customers.forEach(customer => {
                        tbody.innerHTML += `<tr>
                            <td>${customer.id}</td>
                            <td>${customer.name}</td>
                            <td>${customer.age}</td>
                            <td>${customer.country}</td>
                        </tr>`;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">No records found for ${country}</td></tr>`;
                }
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        // Trigger fetch on initial page load
        window.onload = fetchCustomers;
    </script>

</body>
</html>
